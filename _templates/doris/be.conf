# Doris BE config for DHIS2 test instances — based on dhis2-core
# docker/doris/be.conf plus an absolute memory cap (the default is 90% of
# detected memory, which inside Docker Desktop can mean the whole VM).
# 3G is a little above the spike-verified floor (2800M) for the SL-demo
# datavalue load (4.9M values). The compose service adds a 6g
# container-level backstop: BE cap + the FE JVM + the BE's jemalloc cache,
# which mem_limit does not count. Larger databases need more: Lao HMIS
# (27.8M values) failed even at 60% of a 9g container, so test those on a
# bigger host.
mem_limit = 3G

# Make loads flush to disk sooner instead of holding data in memory: smaller
# memtables (default 200 MB each) and a lower cap on total load memory
# (default 50% of mem_limit).
write_buffer_size = 67108864
load_process_max_memory_limit_percent = 30

# Reduce glog verbosity (default is 10, higher = more verbose)
sys_log_verbose_level = 0

sys_log_level = WARN
sys_log_roll_num = 5
sys_log_roll_interval = DAY
