connection.dialect = org.hibernate.dialect.PostgreSQLDialect
connection.driver_class = org.postgresql.Driver
connection.url = jdbc:postgresql://db:5432/dhis2
connection.username = dhis
connection.password = dhis
# Database schema behavior, can be validate, update, create, create-drop
connection.schema = update

encryption.password = def12345678901234567890

# Auditing off. The Artemis audit matrix defaults to CREATE;UPDATE;DELETE for
# all three scopes, so it must be disabled explicitly. Local dev instances are
# disposable and the custom log4j2.xml funnels the audit JSON straight into
# `docker logs`, where it drowns out everything else.
audit.metadata = DISABLED
audit.tracker = DISABLED
audit.aggregate = DISABLED
audit.database = off
audit.logger = off