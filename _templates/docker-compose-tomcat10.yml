services:
  db:
    image: ghcr.io/baosystems/postgis:16-3.5
    restart: always
    # Docker's default 64MB /dev/shm is too small for parallel query and
    # parallel VACUUM on large tables ("could not resize shared memory
    # segment ... No space left on device"). It is a ceiling, not an
    # allocation.
    shm_size: 1g
    # DHIS2 tuning (docs.dhis2.org sysadmin guide) scaled to a ~2GB Postgres
    # budget — the 8GB Docker VM is shared with the Tomcat heap (default 4g)
    # and optionally Doris. effective_cache_size is a planner hint, not an
    # allocation. No mem_limit on purpose: an OOM-killed Postgres mid-restore
    # is worse than brief memory pressure on the VM.
    command:
      - postgres
      - -c
      - jit=off
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - temp_buffers=16MB
      - -c
      - effective_cache_size=2GB
      - -c
      - synchronous_commit=off
      - -c
      - wal_writer_delay=10000ms
      - -c
      - random_page_cost=1.1
      - -c
      - max_locks_per_transaction=96
      - -c
      - track_activity_query_size=8192
      - -c
      - checkpoint_completion_target=0.8
      - -c
      - max_connections=100
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: dhis2
      # Server time zone (d2-instance-create -z, default Etc/UTC). initdb
      # takes the database's default timezone setting from it.
      TZ: "${TIMEZONE}"
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # Over TCP on purpose: on a fresh volume the image's entrypoint runs
      # a temporary init server on the unix socket only, then restarts it.
      # A socket check passes against that temporary server, and work
      # started then is killed by the restart.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dhis -d dhis2"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Apache Doris analytics backend (DHIS2 >= 42). Activated by
  # COMPOSE_PROFILES=analytics-doris in the instance .env (written by
  # d2-instance-create -a doris); inert otherwise. See
  # docs/doris/spike-findings-2026-07-14.md for the sizing rationale.
  doris:
    image: apache/doris:3.0.8-all
    restart: always
    profiles: ["analytics-doris"]
    environment:
      # Docker Desktop's VM has vm.max_map_count=262144 and refuses
      # per-container sysctls; this skips the BE's startup check.
      SKIP_CHECK_ULIMIT: "true"
    mem_limit: 5500m
    volumes:
      # fe.conf/be.conf must NOT be :ro — the entrypoint appends
      # priority_networks on first boot.
      - ./doris/fe.conf:/opt/apache-doris/fe/conf/fe.conf
      - ./doris/be.conf:/opt/apache-doris/be/conf/be.conf
      # DHIS2 hands Doris a bare driver filename; the jar must exist in
      # both FE and BE jdbc_drivers dirs.
      - ./doris/postgresql-42.7.5.jar:/opt/apache-doris/fe/jdbc_drivers/postgresql.jar:ro
      - ./doris/postgresql-42.7.5.jar:/opt/apache-doris/be/jdbc_drivers/postgresql.jar:ro
      - doris_fe_meta:/opt/apache-doris/fe/doris-meta
      - doris_be_storage:/opt/apache-doris/be/storage
    healthcheck:
      # FE answers SELECT 1 ~30-60s before the BE registers; gate on BE
      # aliveness so depends_on really means "Doris can take queries".
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW BACKENDS\\G' 2>/dev/null | grep -q 'Alive: true'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      default: {}
      dev-net:
        aliases:
          - dhis2-${INSTANCE_NAME}-doris

  tomcat:
    image: tomcat:10-jdk17
    restart: always
    depends_on:
      db:
        condition: service_healthy
      # Ignored when the analytics-doris profile is inactive (compose >=
      # 2.20 semantics); with the profile active, tomcat waits for a
      # query-ready Doris.
      doris:
        condition: service_healthy
        required: false
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      DHIS2_HOME: /DHIS2_home
      # DHIS2's "future date" checks use the JVM time zone, so test
      # instances should match the deployment they stand in for.
      TZ: "${TIMEZONE}"
      CATALINA_OPTS: "-Ddhis2.home=/DHIS2_home -Dlog4j2.configurationFile=/DHIS2_home/log4j2.xml -Duser.timezone=${TIMEZONE}${JAVA_MEM_OPTS}"
    volumes:
      - ./DHIS2_HOME:/DHIS2_home
      - ./logs:/usr/local/tomcat/logs
      - ./temp:/usr/local/tomcat/temp
      - ./webapps:/usr/local/tomcat/webapps
      - ./server.xml:/usr/local/tomcat/conf/server.xml
    networks:
      default: {}
      dev-net:
        aliases:
          - dhis2-${INSTANCE_NAME}
          - ${INSTANCE_NAME}

networks:
  default:
  dev-net:
    external: true

volumes:
  db_data:
  doris_fe_meta:
  doris_be_storage: